<style>

[data-theme=dark]{--bg:#0d1120;--card:#161b2e;--tx:#e9ecf6;--mut:#99a2bd;--line:#2a3150;--ac:#9fb1ff;--acx:#0d1120;--red:#ff7b83;--ok:#4fd1a0;--soft:#1f2640;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,"Noto Naskh Arabic",sans-serif}

#hdr{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
#hdr:after{content:"";display:block;height:5px;background:repeating-linear-gradient(90deg,var(--red) 0 14px,var(--ac) 14px 28px,var(--card) 28px 34px)}
.bar{max-width:1000px;margin:auto;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font:700 1.25rem "Bricolage Grotesque",sans-serif;text-decoration:none;color:var(--tx);margin-inline-end:auto}
.bar nav{display:flex;gap:4px}
.bar nav a{padding:6px 11px;border-radius:8px;text-decoration:none;color:var(--tx)}
.bar nav a.on{background:var(--soft);font-weight:700}
select,input,textarea,button{font:inherit;color:inherit}
.inp,select,textarea,input[type=number],input[type=text],input[type=password],input[type=tel]{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.mut{color:var(--mut);font-size:.9rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>label{display:flex;flex-direction:column;gap:3px;font-size:.85rem;color:var(--mut);flex:1 1 110px}
.row>label.chk{flex:0 0 auto;flex-direction:row;align-items:center;gap:6px}

.row input[type=color]{padding:2px;height:38px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pc{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pc:hover{border-color:var(--ac)}
.pc .th{aspect-ratio:3/4;background:var(--soft);display:grid;place-items:center;position:relative;color:var(--mut);font-weight:700}
.pc .th img{width:100%;height:100%;object-fit:cover}
.pc .pt{font-weight:700;padding:8px 10px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .mut{padding:0 10px 8px}
.bd{position:absolute;top:8px;inset-inline-start:8px;background:var(--red);color:#fff;font-style:normal;font-size:.8rem;padding:2px 8px;border-radius:99px}
.bd.g{background:var(--ok)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);border-radius:8px;cursor:pointer;font-weight:700}
.tabs button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}

.blk textarea{margin-bottom:8px;min-height:90px}
.blk img{max-height:90px;border-radius:6px;display:block;margin-bottom:8px}
.prev{display:flex;flex-direction:column;align-items:center;gap:12px;background:var(--soft);padding:12px;border-radius:10px}

.hint{background:var(--soft);padding:8px 12px;border-radius:8px;font-size:.9rem}

[hidden]{display:none!important}

/* ---------- GitHub helpers ---------- */
async function gh(path,opts={}){
  const h={Accept:'application/vnd.github+json'};
  if(S.token)h.Authorization='Bearer '+S.token;
  const r=await fetch('https://api.github.com'+path,{...opts,headers:{...h,...(opts.headers||{})}});
  if(!r.ok){const j=await r.json().catch(()=>({}));const e=new Error(j.message||('Error '+r.status));e.status=r.status;throw e}
  return r.status===204?null:r.json();
}
function b64(buf){const b=new Uint8Array(buf);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)}
const utf8b64=s=>b64(new TextEncoder().encode(s));
const b64utf8=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,'')),c=>c.charCodeAt(0)));
const myRepo=()=>`/repos/${S.user}/${CONFIG.REPO_NAME}`;
async function putFile(path,content,msg){
  const base=`${myRepo()}/contents/${path}`;let last;
  for(let n=0;n<4;n++){
    try{
      let sha;try{sha=(await gh(base)).sha}catch(e){if(e.status!==404)throw e}
      return await gh(base,{method:'PUT',body:JSON.stringify({message:msg,content,sha})});
    }catch(e){last=e;if(![404,409,422,502,503].includes(e.status))throw e;await new Promise(r=>setTimeout(r,2000))}
  }
  throw last;
}
async function delFile(path){
  const base=`${myRepo()}/contents/${path}`;
  try{const r=await gh(base);await gh(base,{method:'DELETE',body:JSON.stringify({message:'Delete',sha:r.sha})})}catch(e){if(e.status!==404)throw e}
}
async function readMeta(){
  try{const r=await gh(`${myRepo()}/contents/meta.json`);return JSON.parse(b64utf8(r.content))}catch(e){if(e.status===404)return[];throw e}
}
async function ensureRepo(){
  try{await gh(myRepo())}catch(e){
    if(e.status!==404)throw e;
    await gh('/user/repos',{method:'POST',body:JSON.stringify({name:CONFIG.REPO_NAME,description:'Global PDF files',auto_init:true,private:false})});
    for(let n=0;n<10;n++){await new Promise(r=>setTimeout(r,1500));try{await gh(`${myRepo()}/contents/README.md`);break}catch(e){}}
  }
  try{await gh(`${myRepo()}/topics`,{method:'PUT',body:JSON.stringify({names:[CONFIG.TOPIC]})})}catch(e){}
}
const rawUrl=(m,p)=>`https://raw.githubusercontent.com/${m.repo}/${m.branch||'main'}/${p}`;
async function loadAll(){
  let repos=[];
  try{const r=await gh(`/search/repositories?q=topic:${CONFIG.TOPIC}&sort=updated&per_page=50`);repos=r.items.map(i=>({full:i.full_name,branch:i.default_branch}))}catch(e){}
  const extra=[...CONFIG.FEATURED_REPOS,...JSON.parse(localStorage.gp_repos||'[]')];
  extra.forEach(f=>{if(!repos.find(r=>r.full===f))repos.push({full:f,branch:'main'})});
  const lists=await Promise.all(repos.map(async r=>{
    try{const x=await fetch(`https://raw.githubusercontent.com/${r.full}/${r.branch}/meta.json?t=${Math.floor(Date.now()/60000)}`);if(!x.ok)return[];
      return (await x.json()).map(m=>({...m,repo:r.full,branch:r.branch})).filter(m=>/^[\w.-]+\/[\w.-]+$/.test(m.repo)&&/^[\w-]+$/.test(m.id))}catch(e){return[]}
  }));
  return lists.flat().sort((a,b)=>(b.created||0)-(a.created||0));
}

/* ---------- Locking paid PDFs (AES-GCM, key from the unlock code) ---------- */
async function deriveKey(code,salt){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encBytes(buf,code){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await deriveKey(code,salt);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,buf));
  const out=new Uint8Array(28+ct.length);out.set(salt,0);out.set(iv,16);out.set(ct,28);return out.buffer;
}
async function decBytes(buf,code){
  const u=new Uint8Array(buf);const key=await deriveKey(code,u.slice(0,16));
  return crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(16,28)},key,u.slice(28));
}

/* ---------- PDF maker (draws pages on canvas so Urdu/Sindhi shaping works) ---------- */
const SIZES={A4:[210,297],A5:[148,210],A3:[297,420],Letter:[215.9,279.4],Legal:[215.9,355.6]};
const PXMM=96/25.4;
const FONTS=['Inter','Lora','Noto Naskh Arabic','Noto Nastaliq Urdu','Arial','Times New Roman','Courier New'];
const newText=()=>({type:'text',text:'',font:'Inter',size:18,color:'#111111',bold:false,italic:false,align:'auto',dir:'auto',lh:1.6});
const D={size:'A4',cw:210,ch:297,orient:'portrait',margin:15,bg:'#ffffff',border:false,borderColor:'#333333',nums:true,blocks:[newText()]};
const pageDims=()=>{let [w,h]=D.size==='Custom'?[+D.cw||210,+D.ch||297]:SIZES[D.size];if(D.orient==='landscape')[w,h]=[h,w];return{w,h}};
const mc=document.createElement('canvas').getContext('2d');
const RTL=/[\u0590-\u08FF\uFB50-\uFEFF]/;

async function renderDoc(scale){
  const {w,h}=pageDims();const PW=w*PXMM,PH=h*PXMM,M=Math.max(0,+D.margin||0)*PXMM,CW=PW-2*M;
  const texts=D.blocks.filter(b=>b.type==='text');
  await Promise.all([...new Set(texts.map(b=>b.font))].map(f=>document.fonts.load(`16px "${f}"`,texts.filter(b=>b.font===f).map(b=>b.text).join('').slice(0,3000)||'a').catch(()=>{})));
  const pages=[];let cx,y;
  const np=()=>{const c=document.createElement('canvas');c.width=Math.round(PW*scale);c.height=Math.round(PH*scale);cx=c.getContext('2d');cx.scale(scale,scale);
    cx.fillStyle=D.bg;cx.fillRect(0,0,PW,PH);
    if(D.border){cx.strokeStyle=D.borderColor;cx.lineWidth=2;cx.strokeRect(M/2,M/2,PW-M,PH-M)}
    y=M;pages.push(c)};
  np();
  for(const b of D.blocks){
    if(b.type==='text'){
      const size=Math.max(6,+b.size||16),lh=size*(+b.lh||1.5);
      const fs=`${b.italic?'italic ':''}${b.bold?'700':'400'} ${size}px "${b.font}", "Noto Naskh Arabic", sans-serif`;
      const rtl=b.dir==='rtl'||(b.dir==='auto'&&RTL.test(b.text));
      mc.font=fs;const lines=[];
      for(const para of b.text.split('\n')){
        if(!para.trim()){lines.push('');continue}
        let cur='';
        for(const wd of para.split(/\s+/).filter(Boolean)){
          const test=cur?cur+' '+wd:wd;
          if(mc.measureText(test).width>CW&&cur){lines.push(cur);cur=wd}else cur=test;
          while(mc.measureText(cur).width>CW&&cur.length>1){let k=cur.length-1;while(k>1&&mc.measureText(cur.slice(0,k)).width>CW)k--;lines.push(cur.slice(0,k));cur=cur.slice(k)}
        }
        lines.push(cur);
      }
      for(const ln of lines){
        if(y+lh>PH-M&&y>M)np();
        if(ln){
          cx.font=fs;cx.fillStyle=b.color;cx.textBaseline='top';cx.direction=rtl?'rtl':'ltr';
          const al=b.align==='auto'?(rtl?'right':'left'):b.align;cx.textAlign=al;
          cx.fillText(ln,al==='left'?M:al==='right'?PW-M:PW/2,y+(lh-size)/2);
        }
        y+=lh;
      }
      y+=size*0.4;
    }else if(b.img){
      let iw=CW*(+b.w||80)/100,ih=iw*b.img.height/b.img.width;
      if(ih>PH-2*M){ih=PH-2*M;iw=ih*b.img.width/b.img.height}
      if(y+ih>PH-M&&y>M)np();
      const x=b.align==='left'?M:b.align==='right'?PW-M-iw:M+(CW-iw)/2;
      cx.drawImage(b.img,x,y,iw,ih);y+=ih+10;
    }
  }
  if(D.nums)pages.forEach((c,i)=>{const x=c.getContext('2d');x.save();x.scale(scale,scale);x.font='11px Inter, sans-serif';x.fillStyle='#777';x.textAlign='center';x.textBaseline='bottom';x.direction='ltr';x.fillText(`${i+1} / ${pages.length}`,PW/2,PH-Math.min(M/2,14));x.restore()});
  return pages;
}
function mkThumb(c){const k=240/c.width,t=document.createElement('canvas');t.width=240;t.height=Math.round(c.height*k);t.getContext('2d').drawImage(c,0,0,t.width,t.height);return t.toDataURL('image/jpeg',.6)}
async function buildPdf(){
  const cv=await renderDoc(2);const {w,h}=pageDims();const J=window.jspdf.jsPDF;
  const o=w>h?'l':'p';const doc=new J({unit:'mm',format:[w,h],orientation:o,compress:true});
  let thumb='';
  for(let i=0;i<cv.length;i++){
    if(i===0)thumb=mkThumb(cv[0]);else doc.addPage([w,h],o);
    doc.addImage(cv[i].toDataURL('image/jpeg',.9),'JPEG',0,0,w,h);cv[i].width=cv[i].height=0;
  }
  return{buf:doc.output('arraybuffer'),pages:cv.length,thumb,text:D.blocks.filter(b=>b.type==='text').map(b=>b.text).join('\n\n').trim()};
}
async function readFile(f){
  try{return await f.arrayBuffer()}catch(e){
    return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('Could not read this file. If it is in Google Drive or Downloads, copy it to your phone storage first.'));r.readAsArrayBuffer(f)});
  }
}
function loadImg(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
  const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
  const out=new Image();out.onload=()=>res(out);out.src=c.toDataURL('image/jpeg',.85)};im.src=r.result};r.readAsDataURL(file)})}
async function pdfThumb(buf){
  const pdf=await pdfjsLib.getDocument({data:buf.slice(0)}).promise;const p=await pdf.getPage(1);
  const v0=p.getViewport({scale:1}),vp=p.getViewport({scale:240/v0.width});

async function openPdf(buf){

    const p=await V.pdf.getPage(i),v0=p.getViewport({scale:1}),vp=p.getViewport({scale:width/v0.width*Math.min(devicePixelRatio||1,2)});
    const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;box.appendChild(c);
    await p.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
  }

async function getText(){

        $('#ap').innerHTML=`<audio controls src="${URL.createObjectURL(audioBlob)}" style="width:100%"></audio>`};
      recorder.start();b.textContent=t('stopRec');
    }catch(e){recorder=null;toast('Microphone is not allowed')}
  };
  $('#pub').onclick=publish;
}
async function publish(){
  if(!S.token){toast(t('loginFirst'));location.hash='#/account';return}
  const title=F.title.trim();if(!title){toast('Enter a title');return}
  if(F.paid){if(!(+F.price>0)){toast('Enter a price');return}if((F.code||'').length<4){toast('Unlock code needs 4+ characters');return}if(!(F.payNum||'').trim()){toast('Enter your JazzCash number');return}}
  let data,stage='preparing the PDF';busy('Preparing PDF…');
  try{
    if(tab==='make'){
      if(!D.blocks.length){busy();toast('Add some text or an image');return}
      data=await buildPdf();
    }else{
      if(!deviceFile){busy();toast('Choose a PDF file');return}
      stage='reading your file';
      const buf=await readFile(deviceFile.file);
      if(!new TextDecoder().decode(new Uint8Array(buf.slice(0,1024))).includes('%PDF')){busy();toast('This file is not a real PDF');return}
      data={buf,pages:deviceFile.pages,thumb:deviceFile.thumb,text:''};
    }
    stage='creating your GitHub repo';await ensureRepo();
    const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6),paid=!!F.paid,code=F.code;
    const wrap=async b=>paid?await encBytes(b,code):b;
    busy('Uploading…');stage='uploading the PDF file';
    await putFile(`pdfs/${id}.pdf${paid?'.enc':''}`,b64(await wrap(data.buf)),'Add PDF');
    if(data.text)await putFile(`pdfs/${id}.txt${paid?'.enc':''}`,b64(await wrap(new TextEncoder().encode(data.text).buffer)),'Add text');
    if(audioBlob)await putFile(`audio/${id}.${audioExt}${paid?'.enc':''}`,b64(await wrap(await audioBlob.arrayBuffer())),'Add voice');
    const entry={id,title,desc:F.desc.trim(),owner:S.user,created:Date.now(),pages:data.pages,tts:F.tts,hasText:!!data.text,audio:audioBlob?audioExt:'',paid,enc:paid,
      thumb:(!paid||F.cover)?data.thumb:''};
    if(paid)Object.assign(entry,{price:+F.price,payNum:F.payNum.trim(),payName:(F.payName||'').trim(),contact:(F.contact||'').trim()});
    busy('Saving…');stage='saving the list';
    const meta=await readMeta();meta.push(entry);await putFile('meta.json',utf8b64(JSON.stringify(meta)),'Update index');
    if(paid)saveSeller();
    const full=`${S.user}/${CONFIG.REPO_NAME}`,known=JSON.parse(localStorage.gp_repos||'[]');if(!known.includes(full)){known.push(full);localStorage.gp_repos=JSON.stringify(known)}
    ITEMS=null;audioBlob=null;F.title=F.desc='';F.code='';deviceFile=null;busy();toast('Published');
    setTimeout(()=>location.hash=`#/v/${full}/${id}`,800);
  }catch(e){busy();console.error(e);
    let why=e.message;
    if(e.status===401)why='Token is invalid or expired. Log in again.';
    else if(/not accessible|forbidden|permission/i.test(why)||e.status===403)why+=' — use a Classic token with public_repo ticked (not Fine-grained).';
    toast('Failed while '+stage+': '+why,15000)}
}

header();route();
</script>
